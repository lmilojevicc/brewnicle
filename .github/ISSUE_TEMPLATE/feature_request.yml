name: Feature request
description: Suggest an improvement to Brewnicle.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do that Brewnicle does not support well?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the desired behavior and any alternatives you considered.
    validations:
      required: true
